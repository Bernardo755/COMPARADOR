<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparador de Excel | Estilo iLovePDF</title>
    <!-- Importamos la librería SheetJS -->
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 800px;
            width: 100%;
        }
        h1 { text-align: center; color: #2c3e50; }
        .file-section {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
        }
        .file-box {
            flex: 1;
            padding: 15px;
            border: 2px dashed #bdc3c7;
            border-radius: 8px;
            text-align: center;
            background: #fafafa;
        }
        button {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }
        button:hover { background-color: #c0392b; }
        button:disabled { background-color: #95a5a6; cursor: not-allowed; }
        .btn-secondary { background-color: #3498db; }
        .btn-secondary:hover { background-color: #2980b9; }
        
        .rules-container { margin-top: 20px; }
        .rule-row {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 10px;
            background: #f8f9fa;
            padding: 10px;
            border-radius: 6px;
        }
        select {
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #ccc;
            flex: 1;
        }
        #process-section {
            display: none;
            margin-top: 30px;
            text-align: center;
        }
        .status { margin-top: 15px; font-weight: bold; color: #27ae60; }
    </style>
</head>
<body>

<div class="container">
    <h1>Cruzar Archivos de Excel</h1>
    
    <div class="file-section">
        <div class="file-box">
            <h3>Excel 1 (Base principal)</h3>
            <input type="file" id="file1" accept=".xlsx, .xls, .csv">
        </div>
        <div class="file-box">
            <h3>Excel 2 (Datos a cruzar)</h3>
            <input type="file" id="file2" accept=".xlsx, .xls, .csv">
        </div>
    </div>
    
    <div style="text-align: center;">
        <button id="btn-load" onclick="cargarArchivos()">Cargar Archivos y Leer Columnas</button>
    </div>

    <!-- Esta sección se muestra después de cargar los archivos -->
    <div id="process-section">
        <h2>¿Qué columnas coinciden? (Reglas de cruce)</h2>
        <div id="rules-wrapper" class="rules-container">
            <!-- Las reglas dinámicas aparecerán aquí -->
        </div>
        
        <div style="display: flex; justify-content: space-between; margin-top: 20px;">
            <button class="btn-secondary" onclick="agregarRegla()">+ Agregar otro cruce</button>
            <button onclick="procesarYDescargar()">Comparar y Descargar Resultado</button>
        </div>
        <div id="status-msg" class="status"></div>
    </div>
</div>

<script>
    // Variables globales para almacenar los datos en memoria
    let dataFile1 = [];
    let dataFile2 = [];
    let headersFile1 = [];
    let headersFile2 = [];

    // Función para leer un archivo y convertirlo a JSON
    async function leerExcel(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = (e) => {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];
                
                // Convertir a JSON, la primera fila será las llaves (cabeceras)
                const jsonData = XLSX.utils.sheet_to_json(worksheet);
                resolve(jsonData);
            };
            reader.onerror = reject;
            reader.readAsArrayBuffer(file);
        });
    }

    async function cargarArchivos() {
        const file1 = document.getElementById('file1').files[0];
        const file2 = document.getElementById('file2').files[0];

        if (!file1 || !file2) {
            alert("Por favor, selecciona ambos archivos Excel.");
            return;
        }

        document.getElementById('btn-load').innerText = "Cargando...";
        document.getElementById('btn-load').disabled = true;

        try {
            // Leer ambos archivos
            dataFile1 = await leerExcel(file1);
            dataFile2 = await leerExcel(file2);

            if (dataFile1.length === 0 || dataFile2.length === 0) {
                throw new Error("Uno de los archivos está vacío.");
            }

            // Extraer las cabeceras (nombres de las columnas) del primer objeto
            headersFile1 = Object.keys(dataFile1[0]);
            headersFile2 = Object.keys(dataFile2[0]);

            // Mostrar la sección de cruces
            document.getElementById('process-section').style.display = "block";
            document.getElementById('rules-wrapper').innerHTML = ""; // Limpiar reglas previas
            
            // Agregar la primera regla por defecto
            agregarRegla();

        } catch (error) {
            alert("Hubo un error al leer los archivos: " + error.message);
        } finally {
            document.getElementById('btn-load').innerText = "Cargar Archivos y Leer Columnas";
            document.getElementById('btn-load').disabled = false;
        }
    }

    function agregarRegla() {
        const wrapper = document.getElementById('rules-wrapper');
        const ruleId = Date.now(); // ID único para la regla

        // Generar opciones para los selects
        const options1 = headersFile1.map(h => `<option value="${h}">${h}</option>`).join('');
        const options2 = headersFile2.map(h => `<option value="${h}">${h}</option>`).join('');

        const ruleHtml = `
            <div class="rule-row" id="rule-${ruleId}">
                <span>Excel 1:</span>
                <select class="col-file1">${options1}</select>
                <span>= Excel 2:</span>
                <select class="col-file2">${options2}</select>
                <button class="btn-secondary" onclick="eliminarRegla(${ruleId})">X</button>
            </div>
        `;
        wrapper.insertAdjacentHTML('beforeend', ruleHtml);
    }

    function eliminarRegla(id) {
        document.getElementById(`rule-${id}`).remove();
    }

    function procesarYDescargar() {
        const msg = document.getElementById('status-msg');
        msg.innerText = "Procesando...";
        
        // 1. Obtener todas las reglas creadas en la interfaz
        const reglas = [];
        document.querySelectorAll('.rule-row').forEach(row => {
            const col1 = row.querySelector('.col-file1').value;
            const col2 = row.querySelector('.col-file2').value;
            reglas.push({ col1, col2 });
        });

        if (reglas.length === 0) {
            alert("Debes tener al menos una regla de cruce.");
            return;
        }

        // 2. Lógica del Cruce (Hash Map para máxima velocidad)
        // Agrupamos el Excel 2 usando como "Llave" la combinación de columnas elegidas
        const mapaExcel2 = new Map();
        
        dataFile2.forEach(fila2 => {
            // Creamos un string único para cada fila basado en las reglas. Ej: "Id123|||juan@mail.com"
            const llaveCruce = reglas.map(r => fila2[r.col2]).join('|||');
            
            if (!mapaExcel2.has(llaveCruce)) {
                mapaExcel2.set(llaveCruce, []);
            }
            mapaExcel2.get(llaveCruce).push(fila2);
        });

        // 3. Buscar coincidencias en Excel 1
        const resultadoFinal = [];

        dataFile1.forEach(fila1 => {
            const llaveCruce = reglas.map(r => fila1[r.col1]).join('|||');

            if (mapaExcel2.has(llaveCruce)) {
                // Hubo coincidencia. Unimos los datos.
                const filasCoincidentes = mapaExcel2.get(llaveCruce);
                
                filasCoincidentes.forEach(fila2 => {
                    let nuevaFila = { ...fila1 }; // Copiamos datos del Excel 1
                    
                    // Añadimos datos del Excel 2 (con prefijo F2_ para evitar sobreescribir si tienen el mismo nombre de columna)
                    for (let key in fila2) {
                        nuevaFila[`F2_${key}`] = fila2[key];
                    }
                    resultadoFinal.push(nuevaFila);
                });
            } else {
                // OPCIONAL: Si quieres que los que NO coinciden también salgan, descomenta la siguiente línea:
                // resultadoFinal.push({ ...fila1, Estado_Cruce: "No encontrado en Excel 2" });
            }
        });

        // 4. Generar el nuevo Excel y descargar
        if (resultadoFinal.length === 0) {
            msg.innerText = "";
            alert("No se encontraron coincidencias con las reglas actuales.");
            return;
        }

        const nuevaHoja = XLSX.utils.json_to_sheet(resultadoFinal);
        const nuevoLibro = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(nuevoLibro, nuevaHoja, "Datos Cruzados");
        
        XLSX.writeFile(nuevoLibro, "Excel_Cruzado_Final.xlsx");
        
        msg.innerText = `¡Éxito! Se cruzaron ${resultadoFinal.length} filas y el archivo se ha descargado.`;
    }
</script>

</body>
</html>
