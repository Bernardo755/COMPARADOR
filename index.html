<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Herramientas Excel | Estilo iLovePDF</title>
    <!-- Importamos la librería SheetJS -->
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 800px;
            width: 100%;
        }
        h1 { text-align: center; color: #2c3e50; margin-top: 0; }
        
        /* Estilos de las pestañas */
        .tabs {
            display: flex;
            gap: 5px;
            margin-bottom: 25px;
            border-bottom: 2px solid #ecf0f1;
            flex-wrap: wrap;
        }
        .tab-btn {
            background-color: transparent;
            color: #7f8c8d;
            border: none;
            padding: 12px 15px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px 8px 0 0;
            transition: all 0.3s ease;
            flex: 1;
        }
        .tab-btn:hover { color: #2c3e50; background-color: #f8f9fa; }
        .tab-btn.active {
            color: #e74c3c;
            border-bottom: 3px solid #e74c3c;
            background-color: #fff;
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Resto de estilos */
        .file-section {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
        }
        .file-box {
            flex: 1;
            padding: 15px;
            border: 2px dashed #bdc3c7;
            border-radius: 8px;
            text-align: center;
            background: #fafafa;
        }
        button {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }
        button:hover { background-color: #c0392b; }
        button:disabled { background-color: #95a5a6; cursor: not-allowed; }
        .btn-secondary { background-color: #3498db; }
        .btn-secondary:hover { background-color: #2980b9; }
        
        .rules-container { margin-top: 20px; }
        .rule-row {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 10px;
            background: #f8f9fa;
            padding: 10px;
            border-radius: 6px;
        }
        select, input[type="number"] {
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #ccc;
            flex: 1;
        }
        .options-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #e8f4f8;
            border-radius: 8px;
            border-left: 4px solid #3498db;
        }
        .status { margin-top: 15px; font-weight: bold; color: #27ae60; text-align: center;}
        .error-list { color: #c0392b; text-align: left; max-width: 100%; margin-top: 15px; font-size: 14px; background: #fdf3f2; padding: 10px 25px; border-radius: 6px; display: none;}
    </style>
</head>
<body>

<div class="container">
    <!-- PESTAÑAS DE NAVEGACIÓN -->
    <div class="tabs">
        <button class="tab-btn active" onclick="cambiarPestana('modulo-cruzar', this)">🔄 Cruzar Archivos</button>
        <button class="tab-btn" onclick="cambiarPestana('modulo-duplicados', this)">📑 Separar Duplicados</button>
        <button class="tab-btn" onclick="cambiarPestana('modulo-unir', this)">📁 Unir Carpeta</button>
    </div>

    <!-- ========================================== -->
    <!-- MÓDULO 1: CRUZAR ARCHIVOS -->
    <!-- ========================================== -->
    <div id="modulo-cruzar" class="tab-content active">
        <h1>Cruzar Archivos de Excel</h1>
        
        <div class="file-section">
            <div class="file-box">
                <h3>Excel 1 (Base principal)</h3>
                <input type="file" id="file1" accept=".xlsx, .xls, .csv">
            </div>
            <div class="file-box">
                <h3>Excel 2 (Datos a cruzar)</h3>
                <input type="file" id="file2" accept=".xlsx, .xls, .csv">
            </div>
        </div>
        
        <div style="text-align: center;">
            <button id="btn-load" onclick="cargarArchivos()">Cargar Archivos y Leer Columnas</button>
        </div>

        <div id="process-section" style="display:none; margin-top: 30px;">
            <h2 style="text-align: center;">¿Qué columnas coinciden? (Reglas de cruce)</h2>
            <div id="rules-wrapper" class="rules-container"></div>
            
            <div style="text-align: right; margin-top: 10px;">
                <button class="btn-secondary" onclick="agregarRegla()">+ Agregar otro cruce</button>
            </div>

            <div class="options-box">
                <label for="tipo-cruce"><strong>¿Qué datos deseas descargar en el resultado final?</strong></label>
                <select id="tipo-cruce" style="width: 100%; margin-top: 10px;">
                    <option value="estricto">Cruce estricto: Solo descargar las filas que tuvieron coincidencia</option>
                    <option value="flexible">Cruce flexible: Conservar todo el Excel 1 (y marcar los que no cruzaron)</option>
                </select>
            </div>
            
            <div style="text-align: center; margin-top: 30px;">
                <button onclick="procesarYDescargar()" style="font-size: 16px; padding: 12px 24px;">Comparar y Descargar Resultado</button>
            </div>
            <div id="status-msg" class="status"></div>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- MÓDULO 2: SEPARAR DUPLICADOS POR TIPO -->
    <!-- ========================================== -->
    <div id="modulo-duplicados" class="tab-content">
        <h1>Separar Duplicados por Tipo</h1>
        
        <div class="file-section">
            <div class="file-box" style="flex: 1;">
                <h3>Sube el Excel con la tabla</h3>
                <input type="file" id="file-dup" accept=".xlsx, .xls, .csv">
            </div>
        </div>
        
        <div style="text-align: center;">
            <button id="btn-load-dup" onclick="cargarArchivoDuplicados()">Leer Columnas</button>
        </div>

        <div id="process-dup-section" style="display:none; margin-top: 30px;">
            <div class="options-box">
                <label for="col-verificar"><strong>1. Columna para verificar la duplicidad (Ej. IDs, Correos):</strong></label>
                <select id="col-verificar" style="width: 100%; margin-top: 10px; margin-bottom: 20px;"></select>
                
                <!-- Evento agregado onchange para actualizar el 3er select -->
                <label for="col-tipo"><strong>2. Columna que contiene los 'Tipos' (Para separar en hojas):</strong></label>
                <select id="col-tipo" style="width: 100%; margin-top: 10px;" onchange="actualizarValoresEstatus()"></select>
                
                <!-- TERCER SELECTOR (NUEVO) -->
                <div style="margin-top: 25px; padding-top: 15px; border-top: 1px dashed #3498db;">
                    <label for="val-estatus"><strong>3. Selecciona el Tipo/Estatus que deseas conservar en la tabla original:</strong><br><small>(La hoja original se limpiará de duplicados y conservará solo los valores únicos de este tipo)</small></label>
                    <select id="val-estatus" style="width: 100%; margin-top: 10px;"></select>
                </div>
            </div>
            
            <div style="text-align: center; margin-top: 30px;">
                <button onclick="procesarDuplicadosYDescargar()" style="font-size: 16px; padding: 12px 24px;">Filtrar, Separar y Descargar</button>
            </div>
            <div id="status-dup-msg" class="status"></div>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- MÓDULO 3: UNIR CARPETA DE ARCHIVOS -->
    <!-- ========================================== -->
    <div id="modulo-unir" class="tab-content">
        <h1>Unir Archivos de una Carpeta</h1>
        
        <div class="options-box">
            <label for="header-row"><strong>¿En qué fila empiezan los encabezados de las tablas?</strong><br> 
            <small>(Aplica para todos los archivos. Si los encabezados están en la primera fila, escribe 1).</small></label>
            <input type="number" id="header-row" value="1" min="1" style="width: 100%; margin-top: 10px;">
        </div>

        <div class="file-section" style="margin-top: 20px;">
            <div class="file-box" style="flex: 1;">
                <h3>Selecciona la carpeta principal</h3>
                <input type="file" id="folder-input" webkitdirectory directory multiple>
            </div>
        </div>
        
        <div style="text-align: center; margin-top: 30px;">
            <button id="btn-process-folder" onclick="procesarCarpetaYDescargar()" style="font-size: 16px; padding: 12px 24px;">Unir Todos y Descargar</button>
        </div>
        
        <div id="status-folder-msg" class="status"></div>
        <ul id="folder-errors" class="error-list"></ul>
    </div>

</div>

<script>
    // ==========================================
    // LOGICA COMPARTIDA
    // ==========================================
    function cambiarPestana(idModulo, btn) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById(idModulo).classList.add('active');
        btn.classList.add('active');
    }

    async function leerExcelComoBuffer(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = (e) => resolve(e.target.result);
            reader.onerror = reject;
            reader.readAsArrayBuffer(file);
        });
    }

    // ==========================================
    // LOGICA MÓDULO 1: CRUZAR ARCHIVOS
    // ==========================================
    let dataFile1 = []; let dataFile2 = []; let headersFile1 = []; let headersFile2 = [];

    async function cargarArchivos() {
        const file1 = document.getElementById('file1').files[0];
        const file2 = document.getElementById('file2').files[0];

        if (!file1 || !file2) return alert("Por favor, selecciona ambos archivos Excel.");

        document.getElementById('btn-load').innerText = "Cargando...";
        document.getElementById('btn-load').disabled = true;

        try {
            const buffer1 = await leerExcelComoBuffer(file1);
            const buffer2 = await leerExcelComoBuffer(file2);
            
            dataFile1 = XLSX.utils.sheet_to_json(XLSX.read(buffer1, {type:'array'}).Sheets[XLSX.read(buffer1, {type:'array'}).SheetNames[0]], {defval:""});
            dataFile2 = XLSX.utils.sheet_to_json(XLSX.read(buffer2, {type:'array'}).Sheets[XLSX.read(buffer2, {type:'array'}).SheetNames[0]], {defval:""});

            if (dataFile1.length === 0 || dataFile2.length === 0) throw new Error("Uno de los archivos está vacío.");

            headersFile1 = Object.keys(dataFile1[0]); headersFile2 = Object.keys(dataFile2[0]);

            document.getElementById('process-section').style.display = "block";
            document.getElementById('rules-wrapper').innerHTML = ""; 
            agregarRegla();
        } catch (error) {
            alert("Hubo un error: " + error.message);
        } finally {
            document.getElementById('btn-load').innerText = "Cargar Archivos y Leer Columnas";
            document.getElementById('btn-load').disabled = false;
        }
    }

    function agregarRegla() {
        const wrapper = document.getElementById('rules-wrapper');
        const ruleId = Date.now(); 
        const options1 = headersFile1.map(h => `<option value="${h}">${h}</option>`).join('');
        const options2 = headersFile2.map(h => `<option value="${h}">${h}</option>`).join('');

        const ruleHtml = `
            <div class="rule-row" id="rule-${ruleId}">
                <span>Excel 1:</span> <select class="col-file1">${options1}</select>
                <span>= Excel 2:</span> <select class="col-file2">${options2}</select>
                <button class="btn-secondary" onclick="eliminarRegla(${ruleId})">X</button>
            </div>
        `;
        wrapper.insertAdjacentHTML('beforeend', ruleHtml);
    }
    function eliminarRegla(id) { document.getElementById(`rule-${id}`).remove(); }

    function procesarYDescargar() {
        const msg = document.getElementById('status-msg');
        msg.innerText = "Procesando...";
        
        const reglas = Array.from(document.querySelectorAll('.rule-row')).map(row => ({
            col1: row.querySelector('.col-file1').value,
            col2: row.querySelector('.col-file2').value
        }));

        if (reglas.length === 0) return alert("Debes tener al menos una regla de cruce.");

        const tipoCruce = document.getElementById('tipo-cruce').value;
        const mapaExcel2 = new Map();
        
        dataFile2.forEach(fila2 => {
            const llaveCruce = reglas.map(r => fila2[r.col2]).join('|||');
            if (!mapaExcel2.has(llaveCruce)) mapaExcel2.set(llaveCruce, []);
            mapaExcel2.get(llaveCruce).push(fila2);
        });

        const resultadoFinal = []; let contadorExito = 0; let contadorFallo = 0;

        dataFile1.forEach(fila1 => {
            const llaveCruce = reglas.map(r => fila1[r.col1]).join('|||');

            if (mapaExcel2.has(llaveCruce)) {
                mapaExcel2.get(llaveCruce).forEach(fila2 => {
                    let nuevaFila = { ...fila1 }; 
                    for (let key in fila2) nuevaFila[`F2_${key}`] = fila2[key];
                    nuevaFila["ESTADO_DEL_CRUCE"] = "✅ Encontrado";
                    resultadoFinal.push(nuevaFila);
                    contadorExito++;
                });
            } else if (tipoCruce === "flexible") {
                let nuevaFila = { ...fila1 };
                nuevaFila["ESTADO_DEL_CRUCE"] = "❌ No existe";
                resultadoFinal.push(nuevaFila);
                contadorFallo++;
            }
        });

        if (resultadoFinal.length === 0) return alert("No hay coincidencias (Cruce estricto).");

        const nuevaHoja = XLSX.utils.json_to_sheet(resultadoFinal);
        const nuevoLibro = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(nuevoLibro, nuevaHoja, "Datos Cruzados");
        XLSX.writeFile(nuevoLibro, "Excel_Cruzado_Final.xlsx");
        
        msg.innerText = `¡Éxito! Coincidencias: ${contadorExito}` + (tipoCruce === "flexible" ? ` | Sin cruzar: ${contadorFallo}` : "");
    }

    // ==========================================
    // LOGICA MÓDULO 2: SEPARAR DUPLICADOS
    // ==========================================
    let dataDup = [];
    async function cargarArchivoDuplicados() {
        const file = document.getElementById('file-dup').files[0];
        if (!file) return alert("Por favor, selecciona un archivo.");

        document.getElementById('btn-load-dup').innerText = "Cargando...";
        document.getElementById('btn-load-dup').disabled = true;

        try {
            const buffer = await leerExcelComoBuffer(file);
            dataDup = XLSX.utils.sheet_to_json(XLSX.read(buffer, {type:'array'}).Sheets[XLSX.read(buffer, {type:'array'}).SheetNames[0]], {defval:""});
            if (dataDup.length === 0) throw new Error("El archivo está vacío.");

            const options = Object.keys(dataDup[0]).map(h => `<option value="${h}">${h}</option>`).join('');
            document.getElementById('col-verificar').innerHTML = options;
            document.getElementById('col-tipo').innerHTML = options;

            // Actualizar el 3er selector dinámicamente según la columna elegida por defecto
            actualizarValoresEstatus();

            document.getElementById('process-dup-section').style.display = "block";
            document.getElementById('status-dup-msg').innerText = "";
        } catch (error) { alert("Hubo un error: " + error.message);
        } finally {
            document.getElementById('btn-load-dup').innerText = "Leer Columnas";
            document.getElementById('btn-load-dup').disabled = false;
        }
    }

    // NUEVA FUNCIÓN: Extrae los valores únicos de la columna de tipos seleccionada
    function actualizarValoresEstatus() {
        const colTipo = document.getElementById('col-tipo').value;
        const selectEstatus = document.getElementById('val-estatus');
        
        if (!colTipo || dataDup.length === 0) return;
        
        const unicos = new Set();
        dataDup.forEach(f => {
            if (f[colTipo] !== undefined && f[colTipo] !== "") {
                unicos.add(f[colTipo]);
            }
        });
        
        // Agregar opción de mantener TODOS los únicos (por si el usuario cambia de opinión)
        let htmlOptions = `<option value="*TODOS*">-- Conservar TODOS los valores únicos (Ignorar filtro) --</option>`;
        
        // Poblar el dropdown con los valores detectados
        Array.from(unicos).forEach(val => {
            htmlOptions += `<option value="${val}">${val}</option>`;
        });
        
        selectEstatus.innerHTML = htmlOptions;
    }

    function procesarDuplicadosYDescargar() {
        const colDup = document.getElementById('col-verificar').value;
        const colTipo = document.getElementById('col-tipo').value;
        const estatusConservar = document.getElementById('val-estatus').value;
        
        const msg = document.getElementById('status-dup-msg');
        msg.innerText = "Procesando...";

        // 1. Contar coincidencias
        const conteo = {};
        dataDup.forEach(f => { 
            if(f[colDup] !== undefined && f[colDup] !== "") {
                conteo[f[colDup]] = (conteo[f[colDup]] || 0) + 1; 
            }
        });

        const gruposDuplicados = {};
        const originalesConservados = [];

        // 2. Separar lógica (Duplicados vs Únicos Conservados)
        dataDup.forEach(f => {
            const idValue = f[colDup];
            if (idValue === undefined || idValue === "") return;

            if (conteo[idValue] > 1) {
                // ES UN DUPLICADO: Se va a la hoja correspondiente a su "Tipo"
                let tipo = f[colTipo] || "Sin Tipo";
                let seguro = tipo.toString().replace(/[\\\/*?:\[\]]/g, '_').substring(0, 31);
                
                if (!gruposDuplicados[seguro]) gruposDuplicados[seguro] = [];
                gruposDuplicados[seguro].push(f);
            } else {
                // ES UN VALOR ÚNICO: ¿Coincide con el Estatus que el usuario quiere conservar?
                let tipoFila = f[colTipo];
                
                if (estatusConservar === "*TODOS*") {
                    originalesConservados.push(f); // Guarda todos los únicos
                } else if (String(tipoFila) === String(estatusConservar)) {
                    originalesConservados.push(f); // Guarda solo los únicos de este Estatus
                }
            }
        });

        // 3. Crear el libro
        const nuevoLibro = XLSX.utils.book_new();

        // 3.1 Añadir la hoja Original (Solo únicos filtrados)
        const hojaOriginal = XLSX.utils.json_to_sheet(originalesConservados.length > 0 ? originalesConservados : [{"Mensaje": "No se encontraron valores únicos con el estatus seleccionado."}]);
        XLSX.utils.book_append_sheet(nuevoLibro, hojaOriginal, "Original (Únicos)");

        // 3.2 Añadir las hojas de duplicados separados
        let totalHojasDup = 0;
        Object.keys(gruposDuplicados).forEach(tipo => {
            XLSX.utils.book_append_sheet(nuevoLibro, XLSX.utils.json_to_sheet(gruposDuplicados[tipo]), tipo);
            totalHojasDup++;
        });

        XLSX.writeFile(nuevoLibro, "Archivo_Filtrado_y_Separado.xlsx");
        
        msg.innerText = `¡Éxito! Se conservaron ${originalesConservados.length} valores únicos en la tabla original, y se separaron los duplicados en ${totalHojasDup} hojas distintas.`;
    }

    // ==========================================
    // LOGICA MÓDULO 3: UNIR CARPETA
    // ==========================================
    async function procesarCarpetaYDescargar() {
        const inputFiles = document.getElementById('folder-input').files;
        const msg = document.getElementById('status-folder-msg');
        const errorList = document.getElementById('folder-errors');
        const btn = document.getElementById('btn-process-folder');
        
        const filaEncabezado = parseInt(document.getElementById('header-row').value) || 1;
        const filasASaltar = Math.max(0, filaEncabezado - 1);

        if (inputFiles.length === 0) return alert("Por favor, selecciona una carpeta.");

        btn.disabled = true;
        btn.innerText = "Procesando archivos...";
        msg.style.color = "#333";
        msg.innerText = "Analizando archivos, por favor no cierres la ventana...";
        errorList.style.display = "none";
        errorList.innerHTML = "";

        const validos = ['.xlsx', '.xls', '.csv'];
        const excelFiles = Array.from(inputFiles).filter(f => validos.some(ext => f.name.toLowerCase().endsWith(ext)));

        if (excelFiles.length === 0) {
            btn.disabled = false;
            btn.innerText = "Unir Todos y Descargar";
            msg.innerText = "";
            return alert("No se encontraron archivos de Excel (.xlsx, .xls) ni CSV.");
        }

        let datosUnidos = [];
        let successCount = 0;
        let erroresLogs = [];

        for (const file of excelFiles) {
            try {
                const rutaCompleta = file.webkitRelativePath || file.name;
                const partesRuta = rutaCompleta.split('/');
                
                const nombreArchivoConExt = partesRuta.pop(); 
                const nombreSinExt = nombreArchivoConExt.substring(0, nombreArchivoConExt.lastIndexOf('.')) || nombreArchivoConExt;
                const subcarpeta = partesRuta.length > 0 ? partesRuta[partesRuta.length - 1] : "Carpeta Raíz";

                const buffer = await leerExcelComoBuffer(file);
                const workbook = XLSX.read(buffer, { type: 'array' });
                const primerHoja = workbook.Sheets[workbook.SheetNames[0]];

                const jsonData = XLSX.utils.sheet_to_json(primerHoja, { defval: "", range: filasASaltar });

                if (jsonData.length === 0) {
                    erroresLogs.push(`<li><strong>${file.name}:</strong> Está vacío a partir de la fila ${filaEncabezado}.</li>`);
                    continue;
                }

                jsonData.forEach(fila => {
                    fila["Nombre del Libro"] = nombreSinExt;
                    fila["Subcarpeta"] = subcarpeta;
                    fila["Ruta"] = rutaCompleta;
                    datosUnidos.push(fila);
                });

                successCount++;
            } catch (error) {
                erroresLogs.push(`<li><strong>${file.name}:</strong> Error al leer el archivo. (${error.message})</li>`);
            }
        }

        if (datosUnidos.length > 0) {
            const nuevaHojaUnida = XLSX.utils.json_to_sheet(datosUnidos);
            const libroUnido = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(libroUnido, nuevaHojaUnida, "Datos Unidos");
            XLSX.writeFile(libroUnido, "Carpeta_Unida_Final.xlsx");
            
            msg.style.color = "#27ae60";
            msg.innerText = `¡Éxito! Se unieron ${successCount} archivos. (Total de filas extraídas: ${datosUnidos.length}).`;
        } else {
            msg.style.color = "#c0392b";
            msg.innerText = "No se logró extraer ningún dato de la carpeta.";
        }

        if (erroresLogs.length > 0) {
            errorList.style.display = "block";
            errorList.innerHTML = `<li style="list-style:none; margin-bottom:8px; font-weight:bold;">Archivos no procesados / con error (${erroresLogs.length}):</li>` + erroresLogs.join('');
        }

        btn.disabled = false;
        btn.innerText = "Unir Todos y Descargar";
    }
</script>

</body>
</html>
